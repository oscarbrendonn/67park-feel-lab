name: Foundation gate and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: feel-lab-pages
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Chat spam, safety, reconnect, 100 home transitions, asset retry and mobile soak
        run: npm run test:browser
        env:
          PARK_SOAK_MS: '900000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: .qa-results/
      - name: Stage only public game files
        run: rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='server/' --exclude='qa/' --exclude='data/' --exclude='.qa-results/' --exclude='.pages-stage/' --exclude='package*.json' ./ .pages-stage/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-stage
  deploy:
    needs: regression
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish only after regression passes
        id: publish
        uses: actions/deploy-pages@v4
