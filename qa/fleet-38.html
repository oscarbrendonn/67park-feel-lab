<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67park Fleet review</title>
<style>body{margin:0;background:#bbc8d7;font:14px system-ui;color:#354951}canvas{display:block}nav{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid white;border-radius:20px;background:#fff9ee;padding:12px 16px;color:inherit}#status{position:fixed;bottom:12px;left:12px;background:#fff9ee;padding:10px 14px;border-radius:16px}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<nav><button id="car">Car</button><button id="bus">Bus</button><button id="parking">Parked cars</button><button id="front">Front plate</button><button id="rear">Rear plate</button><button id="wide">Wide</button></nav><div id="status">Loading vehicle models…</div>
<script type="module">
import * as T from 'three';import {OrbitControls} from '../vendor/addons/controls/OrbitControls.js';import {RoomEnvironment} from '../vendor/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from '../vendor/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from '../vendor/addons/libs/meshopt_decoder.module.js';
import {createCandyVehicle110} from '../island/candy-vehicle-model-v110.js?v=110.2';import {useReferenceCarBody} from '../app/reference-car-body.js?v=fleet-38';import {styleParkBus} from '../app/vehicle-branding.js?v=fleet-38';import {installParkedFleet} from '../app/parked-fleet.js?v=fleet-38';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#c5ced9');const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,300);const control=new OrbitControls(camera,renderer.domElement);control.target.set(0,1,0);
const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment(),env=pmrem.fromScene(room,.08);scene.environment=env.texture;scene.environmentIntensity=.25;room.dispose();pmrem.dispose();scene.add(new T.HemisphereLight('#fff4df','#b6c5be',2));const light=new T.DirectionalLight('#fff4db',2.5);light.position.set(12,20,10);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-35,right:35,top:35,bottom:-35});light.shadow.normalBias=.04;scene.add(light);
const floor=new T.Mesh(new T.PlaneGeometry(180,180),new T.MeshStandardMaterial({color:'#c8b5ac',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.01;scene.add(floor);
const car=useReferenceCarBody(createCandyVehicle110({color:'#8ebfb5'})),bus=styleParkBus(createCandyVehicle110({kind:'bus'}));scene.add(car.group,bus.group);
const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('../island/northwest-sports-v97.glb');const fleet=installParkedFleet(gltf.scene);scene.add(gltf.scene);let active=car,mode='car';
function choose(next){mode=next;active=next==='bus'?bus:car;car.group.visible=next==='car';bus.group.visible=next==='bus';gltf.scene.visible=next==='parking';floor.visible=next!=='parking';wide();document.getElementById('status').textContent=next==='parking'?`8 matching cars · 8 colours · ${fleet.stats.draws} draw calls`:`${next} · ${active.capacity} seats · front + rear colour 67park plates`;}
function wide(){if(mode==='parking'){control.target.set(-29,.6,-24.8);camera.position.set(-7,22,-5)}else{control.target.set(0,1,0);camera.position.set(mode==='bus'?9:7,5,mode==='bus'?12:10)}control.update();}
for(const id of ['car','bus','parking'])document.getElementById(id).onclick=()=>choose(id);document.getElementById('wide').onclick=wide;
for(const [id,side] of [['front',1],['rear',-1]])document.getElementById(id).onclick=()=>{if(mode==='parking')choose('car');control.target.set(0,1,0);camera.position.set(0,1.5,side*(mode==='bus'?6.8:5.8));control.update();};choose('car');
renderer.setAnimationLoop(()=>{control.update();renderer.render(scene,camera)});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script></html>
